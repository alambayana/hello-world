name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Windows test threads run on the platform-default 1 MB stack, which
  # debug builds that spawn child processes overflow (STATUS_STACK_OVERFLOW).
  # Raise the default thread stack for the test harness; harmless on other
  # platforms (their defaults are already large, threads commit lazily).
  RUST_MIN_STACK: "33554432"

jobs:
  check:
    name: Check (fmt, clippy, test, doc) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain (clippy, rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Windows diagnostic — Command-in-spawned-thread probe
        if: matrix.os == 'windows-latest'
        run: |
          Set-Content -Path probe.rs -Value @'
          use std::process::Command;
          fn main() {
              let h = std::thread::spawn(|| {
                  let out = Command::new("cmd")
                      .args(["/C", "echo hi"])
                      .output()
                      .expect("spawn failed");
                  println!("probe got: {}", String::from_utf8_lossy(&out.stdout).trim());
              });
              h.join().expect("thread join failed");
          }
          '@
          rustc probe.rs
          echo "=== probe WITH RUST_MIN_STACK=$env:RUST_MIN_STACK ==="
          ./probe.exe
          echo "probe exit (with env): $LASTEXITCODE"
          Remove-Item Env:RUST_MIN_STACK
          echo "=== probe WITHOUT RUST_MIN_STACK ==="
          ./probe.exe
          echo "probe exit (no env): $LASTEXITCODE"
        env:
          RUST_BACKTRACE: full

      - name: Tests
        if: matrix.os != 'windows-latest'
        run: cargo test

      - name: Documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
