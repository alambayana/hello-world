name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (fmt, clippy, test, doc) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain (clippy, rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        # On Windows this runs only the unit tests: the end-to-end
        # integration tests in tests/cli.rs are gated to Unix in code,
        # because libtest worker threads that call std::process::Command
        # overflow their stack on Windows runners (a toolchain/environment
        # bug, independent of stack size or runner; see tests/cli.rs and
        # docs/design.md "Known limitation"). Unit tests still cover the
        # full parsing contract on Windows, and fmt/clippy/doc compile and
        # lint every target on all three platforms.
        run: cargo test

      - name: Documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
