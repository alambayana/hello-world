name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

defaults:
  run:
    # bash on every runner keeps the scripts portable (the default pwsh
    # shell on Windows cannot parse bash syntax).
    shell: bash

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Create release from tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; keeping it."
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "Prebuilt binaries for ${GITHUB_REF_NAME}. See CHANGELOG.md and the README." \
              --verify-tag
          fi

  build:
    name: Build on ${{ matrix.os }}
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Upload binary to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Cargo names the built binary just `hello-world[.exe]`; copy it
          # to a target-triple-suffixed name so the Linux, macOS, and
          # Windows assets are distinct in the release asset list.
          target="$(rustc -vV | awk '/^host:/{print $2}')"
          src="target/release/hello-world"
          bin="hello-world-${target}"
          case "$target" in
            *windows*)
              src="${src}.exe"
              bin="${bin}.exe"
              ;;
          esac
          cp "$src" "target/release/${bin}"
          gh release upload "$GITHUB_REF_NAME" "target/release/${bin}" --clobber
          echo "Uploaded ${bin}"
